name: Build and Release Android App

on:
  push:
    branches: [ 'web-rtc' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - alpha
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.11.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build tools and platform
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} --install "build-tools;35.0.0" "platform-tools" "platforms;android-36"

    - name: Sync Capacitor for Android
      run: |
        npx cap sync android
        cd android
        chmod +x ./gradlew

    - name: Set app version
      run: |
        cd android
        # Set versionCode based on GitHub run number (with a base offset to ensure uniqueness)
        NEW_VERSION_CODE=${{ github.run_number }}
        sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" app/build.gradle

        # Set versionName to v1.{run_number}
        sed -i "s/versionName \".*\"/versionName \"v1.${{ github.run_number }}\"/" app/build.gradle
        echo "Updated versionCode to $NEW_VERSION_CODE and versionName to v1.${{ github.run_number }}"

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
      env:
        JAVA_OPTS: -Xmx2048m

    - name: Sign APK with existing certificate files
      run: |
        cd android
        # Check if apksigner is available
        which apksigner
        # Sign the APK with the existing certificate files
        apksigner sign --key key.pk8 --cert x509.pem --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
        # Verify the signature
        apksigner verify app/build/outputs/apk/release/app-release-signed.apk

    - name: Get APK path
      id: apk
      run: |
        # Check if the signed APK exists, otherwise use the unsigned one
        if [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
          APK_PATH="android/app/build/outputs/apk/release/app-release-signed.apk"
        else
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-release-unsigned.apk" | head -n 1)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK Path: $APK_PATH"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: ${{ steps.apk.outputs.apk_path }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main') || github.event.inputs.release_type == 'production'
      with:
        tag_name: v1.${{ github.run_number }}
        name: Release v1.${{ github.run_number }}
        body: |
          Release build v1.${{ github.run_number }}
          - Build: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
        files: ${{ steps.apk.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Pre-release
      uses: softprops/action-gh-release@v2
      if: github.event.inputs.release_type != 'production' && github.event.inputs.release_type != ''
      with:
        tag_name: v1.${{ github.run_number }}-${{ github.event.inputs.release_type }}
        name: ${{ github.event.inputs.release_type }} Release v1.${{ github.run_number }}
        body: |
          ${{ github.event.inputs.release_type }} release build v1.${{ github.run_number }}
          - Build: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Triggered manually: ${{ github.event.inputs.release_type }}
        files: ${{ steps.apk.outputs.apk_path }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
