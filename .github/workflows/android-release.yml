name: Build and Release Android App

on:
  push:
    branches: [ 'web-rtc' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - alpha
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.11.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build web assets
      run: npm run build

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build tools and platform
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} --install "build-tools;35.0.0" "platform-tools" "platforms;android-36"

    - name: Check for build tools
      run: |
        echo "Checking for build tools in ${ANDROID_HOME}/build-tools/35.0.0/"
        ls -la ${ANDROID_HOME}/build-tools/35.0.0/ | grep -E "(apksigner|zipalign)"
        which zipalign || echo "zipalign not in PATH"
        which apksigner || echo "apksigner not in PATH"

    - name: Sync Capacitor for Android
      run: |
        npx cap sync android
        cd android
        chmod +x ./gradlew

    - name: Set app version
      run: |
        cd android
        # Set versionCode based on GitHub run number (with a base offset to ensure uniqueness)
        NEW_VERSION_CODE=${{ github.run_number }}
        sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" app/build.gradle

        # Set versionName to v1.{run_number}
        sed -i "s/versionName \".*\"/versionName \"v1.${{ github.run_number }}\"/" app/build.gradle
        echo "Updated versionCode to $NEW_VERSION_CODE and versionName to v1.${{ github.run_number }}"

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
      env:
        JAVA_OPTS: -Xmx2048m

    - name: Sign APK with existing certificate files
      run: |
        cd android

        # Check if the necessary signing files exist
        if [ ! -f "key.pk8" ] || [ ! -f "x509.pem" ]; then
          echo "Signing certificate files not found. APK will not be signed."
          echo "Looking for key.pk8: $(if [ -f key.pk8 ]; then echo 'FOUND'; else echo 'NOT FOUND'; fi)"
          echo "Looking for x509.pem: $(if [ -f x509.pem ]; then echo 'FOUND'; else echo 'NOT FOUND'; fi)"
          exit 0  # Exit successfully to continue workflow, unsigned APK will be used
        fi

        # Check if apksigner is available
        if ! which apksigner; then
          echo "apksigner not found in PATH"
          # Add common paths where apksigner might be located
          export PATH="$PATH:$ANDROID_HOME/build-tools/35.0.0"
          if ! which apksigner; then
            echo "apksigner still not found - attempting to find in build-tools directories"
            for build_tool_dir in $ANDROID_HOME/build-tools/*; do
              if [ -f "$build_tool_dir/apksigner" ] || [ -f "$build_tool_dir/apksigner.bat" ]; then
                export PATH="$PATH:$build_tool_dir"
                break
              fi
            done
          fi
        fi

        if ! which apksigner; then
          echo "apksigner still not found after checking all build-tools directories"
          exit 0  # Exit successfully to continue workflow, unsigned APK will be used
        fi

        if ! which zipalign; then
          echo "zipalign not found in PATH, trying to find in build-tools directories"
          for build_tool_dir in $ANDROID_HOME/build-tools/*; do
            if [ -f "$build_tool_dir/zipalign" ] || [ -f "$build_tool_dir/zipalign.bat" ]; then
              export PATH="$PATH:$build_tool_dir"
              break
            fi
          done
        fi

        # Find the actual release APK that was built (could be named differently)
        APK_PATH=$(find app/build/outputs/apk/release -name "*release*.apk" -type f | head -n 1)

        if [ ! -f "$APK_PATH" ]; then
          echo "No release APK found in app/build/outputs/apk/release"
          ls -la app/build/outputs/apk/release/
          exit 1
        fi

        echo "Found APK to sign: $APK_PATH"

        # Copy the APK to a consistent name for signing
        cp "$APK_PATH" app/build/outputs/apk/release/app-release-unsigned-aligned.apk

        # Zipalign the APK (recommended before signing)
        if which zipalign; then
          echo "Running zipalign..."
          zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned-aligned.apk app/build/outputs/apk/release/app-release-aligned.apk
        else
          echo "zipalign not available, skipping alignment"
          cp app/build/outputs/apk/release/app-release-unsigned-aligned.apk app/build/outputs/apk/release/app-release-aligned.apk
        fi

        # Sign the APK with the existing certificate files
        echo "Signing APK with apksigner..."
        apksigner sign --key key.pk8 --cert x509.pem --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-aligned.apk

        # Verify the signature
        if apksigner verify app/build/outputs/apk/release/app-release-signed.apk; then
          echo "APK signing completed successfully"
          echo "Signed APK is at: app/build/outputs/apk/release/app-release-signed.apk"
        else
          echo "APK verification failed"
          exit 1
        fi

    - name: Get APK path
      id: apk
      run: |
        # Check if the signed APK exists
        if [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
          APK_PATH="android/app/build/outputs/apk/release/app-release-signed.apk"
          echo "Using signed APK: $APK_PATH"
        elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          echo "Using built APK (not signed): $APK_PATH"
        else
          # Fallback: find any APK in the release directory
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in release directory!"
            ls -la android/app/build/outputs/apk/release/
            exit 1
          fi
          echo "Using found APK: $APK_PATH"
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK Path: $APK_PATH"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: ${{ steps.apk.outputs.apk_path }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main') || github.event.inputs.release_type == 'production'
      with:
        tag_name: v1.${{ github.run_number }}
        name: Release v1.${{ github.run_number }}
        body: |
          Release build v1.${{ github.run_number }}
          - Build: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Status: APK built successfully
        files: ${{ steps.apk.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Pre-release
      uses: softprops/action-gh-release@v2
      if: github.event.inputs.release_type != 'production' && github.event.inputs.release_type != ''
      with:
        tag_name: v1.${{ github.run_number }}-${{ github.event.inputs.release_type }}
        name: ${{ github.event.inputs.release_type }} Release v1.${{ github.run_number }}
        body: |
          ${{ github.event.inputs.release_type }} release build v1.${{ github.run_number }}
          - Build: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Triggered manually: ${{ github.event.inputs.release_type }}
          - Status: APK built successfully
        files: ${{ steps.apk.outputs.apk_path }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
