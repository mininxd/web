<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material You 3.0 File Uploader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body style="background-color: var(--surface); color: var(--on-surface); font-family: 'Roboto Flex', sans-serif;" class="">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div style="background-color: var(--surface-container);" class="rounded-2xl shadow-lg overflow-hidden">
            <!-- Header -->
            <div style="background-color: var(--primary); color: var(--on-primary);" class="p-6 sm:p-8 relative">
                <div class="flex items-center">
                    <i class="material-icons text-4xl sm:text-5xl">cloud_upload</i>
                    <div class="ml-4">
                        <h1 class="text-2xl sm:text-3xl font-bold">File Uploader</h1>
                        <p class="text-sm sm:text-base" style="color: var(--on-primary);">A modern and intuitive file uploading experience</p>
                    </div>
                </div>
            </div>

            <!-- Upload Area -->
            <div class="p-6 sm:p-8">
                <div id="uploadArea" style="border-color: var(--outline);" class="border-2 border-dashed rounded-xl text-center p-8 sm:p-12 cursor-pointer hover:border-purple-500 transition-all">
                    <div style="color: var(--on-surface-variant);">
                        <i class="material-icons text-5xl sm:text-6xl">upload_file</i>
                        <p class="mt-4 text-lg sm:text-xl font-semibold" style="color: var(--on-surface);">Drag and drop your files here</p>
                        <p class="text-sm mt-1" style="color: var(--on-surface-variant);">or click to browse</p>
                    </div>
                    <input type="file" id="fileInput" class="hidden" multiple>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden p-6 sm:p-8">
                <div style="background-color: var(--surface-variant);" class="w-full rounded-full h-2.5">
                    <div id="progressFill" style="background-color: var(--primary);" class="h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <div id="progressText" class="text-center text-sm mt-2" style="color: var(--on-surface-variant);"></div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden p-4 m-6 sm:m-8 bg-red-100 dark:bg-red-900 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg relative" role="alert">
                <i class="material-icons">error</i>
                <span id="errorText" class="ml-2"></span>
            </div>

            <!-- Files List -->
            <div id="filesSection" class="hidden p-6 sm:p-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl sm:text-2xl font-bold">Uploaded Files</h2>
                    <button id="downloadAllBtn" style="background-color: var(--primary); color: var(--on-primary);" class="font-bold py-2 px-4 rounded-lg inline-flex items-center transition-all disabled:opacity-50">
                        <i class="material-icons mr-2">download</i>
                        <span>Download All</span>
                    </button>
                </div>
                <div id="filesList" class="space-y-4"></div>
            </div>

            <!-- Footer -->
            <div class="p-4 sm:p-6 text-center text-xs border-t" style="background-color: var(--surface-container-high); color: var(--on-surface-variant); border-color: var(--outline-variant);">
                <p>All files are securely processed at <span id="endpoint-url" class="font-semibold" style="color: var(--primary);">localhost:3000</span></p>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
