<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material You 3.0 File Uploader</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="p-6 sm:p-8 bg-gradient-to-r from-purple-500 to-indigo-500 text-white relative">
                <div class="flex items-center">
                    <i class="material-icons text-4xl sm:text-5xl">cloud_upload</i>
                    <div class="ml-4">
                        <h1 class="text-2xl sm:text-3xl font-bold">File Uploader</h1>
                        <p class="text-sm sm:text-base text-purple-200">A modern and intuitive file uploading experience</p>
                    </div>
                </div>
            </div>

            <!-- Upload Area -->
            <div class="p-6 sm:p-8">
                <div id="uploadArea" class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl text-center p-8 sm:p-12 cursor-pointer hover:border-purple-500 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all">
                    <div class="text-gray-400 dark:text-gray-500">
                        <i class="material-icons text-5xl sm:text-6xl">upload_file</i>
                        <p class="mt-4 text-lg sm:text-xl font-semibold text-gray-700 dark:text-gray-300">Drag and drop your files here</p>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">or click to browse</p>
                    </div>
                    <input type="file" id="fileInput" class="hidden" multiple>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden p-6 sm:p-8">
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                    <div id="progressFill" class="bg-purple-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <div id="progressText" class="text-center text-sm text-gray-600 dark:text-gray-400 mt-2"></div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden p-4 m-6 sm:m-8 bg-red-100 dark:bg-red-900 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg relative" role="alert">
                <i class="material-icons">error</i>
                <span id="errorText" class="ml-2"></span>
            </div>

            <!-- Files List -->
            <div id="filesSection" class="hidden p-6 sm:p-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl sm:text-2xl font-bold">Uploaded Files</h2>
                    <button id="downloadAllBtn" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg inline-flex items-center transition-all disabled:opacity-50">
                        <i class="material-icons mr-2">download</i>
                        <span>Download All</span>
                    </button>
                </div>
                <div id="filesList" class="space-y-4"></div>
            </div>

            <!-- Footer -->
            <div class="p-4 sm:p-6 bg-gray-50 dark:bg-gray-900/50 text-center text-xs text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-700">
                <p>All files are securely processed at <span class="font-semibold text-purple-500">localhost:3000</span></p>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
