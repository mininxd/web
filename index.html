<!doctype html>
<html data-theme="emerald" id="html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="./src/main.js"></script>
    <link rel="stylesheet" href="./src/local-fonts.css">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dns.mininxd.xyz</title>
  </head>
  <body class="bg-base-100 text-base-content min-h-screen flex flex-col items-center py-6">

    <div class="w-full max-w-6xl px-4 flex-grow">

      <h1 id="title_header" class="text-center font-bold font-outfit text-5xl">MININXD DNS</h1>

      <div id="dns_content" class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Main Content Column -->
        <div class="lg:col-span-2 flex flex-col space-y-6">

          <div id="headerWrapper" class="w-full">
            <div class="text-center">
              <span id="subtitle_text" class="block">Block Ads, Malware, and Stay Safe Online</span>
            </div>

            <div class="text-center w-full mt-8 font-jetbrains">
              <span id="getting_ip_text" class="ipv4 font-outfit text-5xl font-medium">Getting your IP...</span>
              <br>
              <span id="ConnectionStatus"></span><br>
            </div>

            <div class="px-2">
              <div id="isConnected" class="w-full bg-primary rounded-md px-2 text-white font-jetbrains">
              </div>
            </div>
          </div>
        
        <div id="app"></div>
      </div>

      <div id="footer" class="mt-12 text-center opacity-30">dns.mininxd.xyz</div>

    </div>

    <!-- Blocked Content Overlay (Hidden) -->
    <div style="display:none;" class="hidden font-jetbrains" id="blocked_content">
      <div class="p-4 text-center justify-center min-h-screen flex flex-col items-center">
        <div class="flex-grow flex flex-col justify-center">
          <p id="access_denied_text" class="italic text-md py-4">Access to <span class="font-bold text-red-500" id="blockedUrl"></span> has been denied.</p>
          <p class="text-red-500 text-lg font-bold">
           <span id="request_blocked_messages">
           Your request was blocked by the DNS protection system.
           </span>
          </p>
          <p class="opacity-75 mt-12">
           <span id="lang_redirect_prev_page">
           Redirecting you to previous page
           </span>
           <span id="blocked_redirect"></span>
          </p>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
