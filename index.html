<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Lister</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body style="background-color: var(--surface); color: var(--on-surface); font-family: 'Roboto Flex', sans-serif;">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div style="background-color: var(--surface-container);" class="rounded-2xl shadow-lg overflow-hidden">
            <div style="background-color: var(--primary); color: var(--on-primary);" class="p-6 sm:p-8 relative">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl sm:text-3xl font-bold">Files</h1>
                    <button id="downloadAllButton" style="background-color: var(--tertiary); color: var(--on-tertiary);" class="px-4 py-2 rounded-lg shadow-md hover:opacity-80 transition-opacity">
                        <span class="material-icons" style="vertical-align: middle;">archive</span>
                        Download All
                    </button>
                </div>
                <p class="text-sm sm:text-base" style="color: var(--on-primary);">A list of all files in the project directory.</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden p-4 m-6 sm:m-8 bg-red-100 dark:bg-red-900 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg relative" role="alert">
                <i class="material-icons">error</i>
                <span id="errorText" class="ml-2"></span>
            </div>

            <!-- Files List -->
            <div class="p-6 sm:p-8">
                <ul id="filesList" class="space-y-2"></ul>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
